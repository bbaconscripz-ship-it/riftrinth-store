<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0b0d">
<meta name="robots" content="noindex">
<title>Publish a Mod</title>
<link rel="icon" href="https://stripes.lol/assets/img/151.png">
<!-- Shared look from stripes.lol; the rules below only add the form pieces it doesn't have. -->
<link rel="stylesheet" href="https://stripes.lol/assets/css/styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root { --bg:#0b0b0d; --surface:#121216; --surface-raised:#17171c; --border:#22222a; --border-strong:#32323d; --text:#ededf0; --text-muted:#9a9aa6; --text-faint:#5f5f6b; --accent:#ff4d55; --accent-hover:#ff6a70; --ok:#6fcf8f; --radius-sm:10px; --radius-lg:18px; --font-sans:"Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --font-mono:ui-monospace, Consolas, monospace; }
  body { background:var(--bg); color:var(--text); font-family:var(--font-sans); margin:0; }
  .stack { display:flex; flex-direction:column; gap:14px; }
  .card h2 { margin:0; font-size:1rem; font-weight:600; }
  label { display:block; font-size:0.8125rem; color:var(--text-muted); margin:12px 0 6px; }
  input, textarea { width:100%; box-sizing:border-box; background:#0c0c0f; color:var(--text); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px; font:inherit; font-size:0.9375rem; transition:border-color .2s ease; }
  input:focus, textarea:focus { outline:none; border-color:var(--border-strong); }
  textarea { min-height:96px; resize:vertical; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:0 12px; }
  @media (max-width:560px) { .row2 { grid-template-columns:1fr; } }
  .drop { border:1px dashed var(--border-strong); border-radius:var(--radius-sm); padding:26px 12px; text-align:center; color:var(--text-muted); font-size:0.875rem; cursor:pointer; transition:border-color .2s ease, background-color .2s ease; }
  .drop:hover, .drop.over { border-color:var(--accent); background:rgba(255,77,85,.05); color:var(--text); }
  .drop strong { color:var(--text); }
  .actions { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:4px; }
  .btn:disabled { opacity:.5; cursor:default; }
  .hint { font-size:0.8125rem; color:var(--text-muted); margin:0; }
  #log { white-space:pre-wrap; font:0.8125rem/1.6 var(--font-mono); color:var(--text-muted); }
  #log:empty { display:none; }
  .ok { color:var(--ok); } .bad { color:var(--accent); }
  ul.mods { list-style:none; margin:0; padding:0; }
  ul.mods li { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:10px 0; border-top:1px solid var(--border); }
  ul.mods li:first-child { border-top:0; padding-top:0; }
  ul.mods li > div > div { font-weight:600; font-size:0.9375rem; }
  ul.mods small { color:var(--text-muted); font-size:0.8125rem; }
  ul.mods .btn { height:34px; padding:0 12px; font-size:0.8125rem; }
</style>
</head>
<body>
<div class="page">
  <nav class="topbar">
    <a class="back" href="https://stripes.lol/driftrinth.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m11 6-6 6 6 6"/></svg>Driftrinth</a>
  </nav>

  <header class="header">
    <p class="eyebrow">Driftrinth mod store</p>
    <h1 class="title">Publish a Mod</h1>
  </header>

  <main class="stack">
    <section class="card" id="auth">
      <h2>Password</h2>
      <input id="password" type="password" placeholder="Upload password" autocomplete="current-password" aria-label="Upload password">
      <div class="actions">
        <button id="login" class="btn">Unlock</button>
        <span id="authStatus" class="hint"></span>
      </div>
    </section>

    <section class="card">
      <h2>New mod or update</h2>
      <div id="drop" class="drop"><strong>Drop a .zip here</strong> or click to choose<br><span id="fileInfo">It needs a matching .utoc, .ucas and .pak</span></div>
      <input id="file" type="file" accept=".zip" hidden>
      <div>
        <div class="row2">
          <div><label for="name">Name</label><input id="name" placeholder="My Mod"></div>
          <div><label for="creator">Creator</label><input id="creator" placeholder="MeiMei"></div>
        </div>
        <div class="row2">
          <div><label for="version">Version</label><input id="version" value="1.0.0"></div>
          <div><label for="tags">Tags (comma separated)</label><input id="tags" placeholder="visuals, fun"></div>
        </div>
        <label for="summary">Description (short, shown on the card)</label>
        <input id="summary" placeholder="What it does">
        <label for="about">About (longer, shown on the mod page)</label>
        <textarea id="about" placeholder="Details, credits, how to use it"></textarea>
      </div>
      <p class="hint">Using the same name as an existing mod updates it instead of adding a second one.</p>
      <div class="actions">
        <button id="publish" class="btn btn-primary">Release</button>
        <span id="status" class="hint"></span>
      </div>
      <div id="log"></div>
    </section>

    <section class="card">
      <h2>In the store</h2>
      <ul id="mods" class="mods"><li><small>Unlock to load the list.</small></li></ul>
    </section>
  </main>

  <footer class="footer">stripes.lol</footer>
</div>

<script>
// Uploads go through the store's Cloudflare Worker, which checks the password
// and commits to GitHub. The password and GitHub token live only on the Worker.
const UPLOAD_API = "https://driftshop-upload.wannabeweirdguy.workers.dev";
const LIMIT = 100 * 1024 * 1024; // GitHub rejects larger single files
const $ = id => document.getElementById(id);
let zipFile = null, mods = null;

async function api(path, fields) {
  const form = new FormData();
  form.append("password", $("password").value);
  for (const [k, v] of Object.entries(fields || {})) form.append(k, v);
  let r;
  try { r = await fetch(UPLOAD_API + path, { method: "POST", body: form }); }
  catch { throw new Error("Couldn't reach the upload server."); }
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.error || `Upload server error ${r.status}`);
  return body;
}

const log = (msg, cls) => { const d = document.createElement("div"); d.textContent = msg; if (cls) d.className = cls; $("log").append(d); };
const status = (el, msg, cls) => { $(el).textContent = ""; $(el).append(Object.assign(document.createElement("span"), { className: cls || "", textContent: msg })); };

function renderMods() {
  const ul = $("mods"); ul.textContent = "";
  if (!mods.length) { ul.innerHTML = "<li><small>No mods yet.</small></li>"; return; }
  for (const m of mods) {
    const li = document.createElement("li");
    const info = document.createElement("div");
    info.innerHTML = `<div></div><small></small>`;
    info.firstChild.textContent = m.name;
    info.lastChild.textContent = `v${m.version} by ${m.creator}`;
    const btn = document.createElement("button");
    btn.className = "btn btn-ghost"; btn.textContent = "Update";
    btn.onclick = () => {
      $("name").value = m.name; $("creator").value = m.creator; $("version").value = m.version;
      $("tags").value = (m.tags || []).join(", "); $("summary").value = m.summary || "";
      $("about").value = m.description && m.description !== m.summary ? m.description : "";
      window.scrollTo({ top: 0, behavior: "smooth" });
      $("status").textContent = `Editing ${m.name}. Drop the new zip to release it.`;
    };
    li.append(info, btn); ul.append(li);
  }
}

async function login() {
  status("authStatus", "Checking...");
  try {
    mods = (await api("/login")).mods;
    renderMods();
    status("authStatus", "Unlocked", "ok");
  } catch (e) { status("authStatus", e.message, "bad"); }
}

function pickFile(f) {
  if (!f) return;
  if (!/\.zip$/i.test(f.name)) { $("fileInfo").textContent = "That isn't a .zip file."; return; }
  zipFile = f; $("fileInfo").textContent = `${f.name} (${(f.size / 1024).toFixed(0)} KB)`;
}

// Same rules as add_mod.py: keep only complete .utoc/.ucas/.pak sets, flattened into a fresh zip.
async function repack(file) {
  const src = await JSZip.loadAsync(file);
  const stems = {};
  src.forEach((path, entry) => {
    if (entry.dir) return;
    const base = path.split("/").pop(), m = base.match(/^(.*)\.(utoc|ucas|pak)$/i);
    if (m) (stems[m[1]] ||= {})[m[2].toLowerCase()] = entry;
  });
  const complete = Object.entries(stems).filter(([, fs]) => Object.keys(fs).length === 3);
  if (!complete.length) throw new Error("No complete patch found. The zip needs a .utoc, .ucas and .pak with the same name.");
  const out = new JSZip();
  for (const [stem, fs] of complete)
    for (const [ext, entry] of Object.entries(fs)) out.file(`${stem}.${ext}`, await entry.async("uint8array"));
  return { bytes: await out.generateAsync({ type: "uint8array", compression: "DEFLATE" }), patches: complete.map(([s]) => s) };
}

async function publish() {
  $("log").textContent = "";
  const name = $("name").value.trim(), creator = $("creator").value.trim();
  if (!$("password").value) return log("Enter the password first.", "bad");
  if (!zipFile) return log("Choose a zip first.", "bad");
  if (!name || !creator) return log("Name and creator are required.", "bad");

  $("publish").disabled = true;
  try {
    log("Repacking zip...");
    const { bytes, patches } = await repack(zipFile);
    if (bytes.length > LIMIT) throw new Error("The zip is over GitHub's 100 MB file limit.");
    log(`Patch: ${patches.join(", ")}, ${bytes.length} bytes`);
    log("Releasing...");
    const res = await api("/upload", {
      name, creator, version: $("version").value.trim(), tags: $("tags").value,
      summary: $("summary").value, about: $("about").value,
      file: new File([bytes], "mod.zip", { type: "application/zip" }),
    });
    log(`${res.updated ? "Updated" : "Released"} ${name}. It shows in Driftrinth after Pages rebuilds, usually within a few minutes.`, "ok");
    zipFile = null; $("file").value = ""; $("fileInfo").textContent = "It needs a matching .utoc, .ucas and .pak";
    mods = res.mods; renderMods();
  } catch (e) {
    log(/409/.test(e.message) ? `${e.message}\nThe store changed while releasing. Try again.` : e.message, "bad");
  } finally { $("publish").disabled = false; }
}

$("login").onclick = login;
$("password").onkeydown = e => { if (e.key === "Enter") login(); };
$("publish").onclick = publish;
$("drop").onclick = () => $("file").click();
$("file").onchange = e => pickFile(e.target.files[0]);
$("drop").ondragover = e => { e.preventDefault(); $("drop").classList.add("over"); };
$("drop").ondragleave = () => $("drop").classList.remove("over");
$("drop").ondrop = e => { e.preventDefault(); $("drop").classList.remove("over"); pickFile(e.dataTransfer.files[0]); };
</script>
</body>
</html>
